[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Othello"
version = "2.0"
description = "Implementation of Othello game."
dependencies = [
    "PyQt5"
]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools]
provides = ["othello"]

[project.scripts]
othello = "src.main:main"